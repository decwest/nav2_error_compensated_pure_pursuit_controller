controller_server:
  ros__parameters:
    controller_frequency: 30.0
    min_x_velocity_threshold: 0.001
    min_approach_linear_velocity: 0.05
    min_theta_velocity_threshold: 0.001
    failure_tolerance: 0.3
    progress_checker_plugin: "progress_checker"
    goal_checker_plugins: ["goal_checker"]
    controller_plugins: ["FollowPath"]

    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.5
      movement_time_allowance: 10.0
    goal_checker:
      plugin: "nav2_controller::SimpleGoalChecker"
      xy_goal_tolerance: 0.25
      yaw_goal_tolerance: 0.25
      stateful: True

    FollowPath:
      plugin: "nav2_error_compensated_pure_pursuit_controller::ErrorCompensatedPurePursuitController"
      # Inherited regulated pure pursuit parameters
      desired_linear_vel: 0.5
      lookahead_dist: 0.5
      use_velocity_scaled_lookahead_dist: false
      transform_tolerance: 0.1
      min_approach_linear_velocity: 0.05
      approach_velocity_scaling_dist: 0.6
      use_collision_detection: true
      max_allowed_time_to_collision_up_to_carrot: 1.0
      use_regulated_linear_velocity_scaling: false
      use_fixed_curvature_lookahead: false
      use_cost_regulated_linear_velocity_scaling: false
      regulated_linear_scaling_min_radius: 0.9
      regulated_linear_scaling_min_speed: 0.25
      use_rotate_to_heading: false
      allow_reversing: false
      max_robot_pose_search_dist: 10.0
      # ECPP parameters
      ecpp.omega_n: 1.41            # target natural frequency [rad/s]
      ecpp.zeta: 1.0                # target damping ratio [-]
      ecpp.v_epsilon: 0.05          # low-speed regularization [m/s]
      ecpp.gate_mode: "ey_only"     # ey_only | product | always_on | off
      ecpp.gate_error_on: 0.10      # relative linearization error ON threshold
      ecpp.gate_error_off: 0.50     # relative linearization error OFF threshold
      ecpp.gate_endpoint_value: 0.01
      ecpp.omega_max: 2.0           # angular velocity clip [rad/s]
      ecpp.v_gain_source: "commanded"  # commanded | measured
      ecpp.error_search_window: 2.0    # arc length searched for the nearest segment [m]
      ecpp.error_filter_tau: 0.0    # LPF time constant [s] on (e_y, e_psi); 0 = off.
                                    # For noisy localization try ~0.1 (keep omega_n*tau << 1).
