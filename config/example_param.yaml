# Example controller-server configuration. Merge into your robot's Nav2 parameters.
# Design example for a straight path:
#   v0 = 0.5 m/s, L_d = 1.0 m, omega_bar = 1.5 rad/s, epsilon_off = 0.50.
#   omega_n_ref = sqrt(v0 * omega_bar / (sqrt(epsilon_off) * L_d)) = 1.030 rad/s.
# This is a gain-selection reference, not a guarantee against saturation.
# Set physical velocity/acceleration limits in the downstream Nav2 velocity smoother.

controller_server:
  ros__parameters:
    controller_frequency: 30.0
    min_x_velocity_threshold: 0.001
    min_theta_velocity_threshold: 0.001
    failure_tolerance: 0.3
    progress_checker_plugins:
    - progress_checker
    goal_checker_plugins:
    - goal_checker
    controller_plugins:
    - FollowPath
    progress_checker:
      plugin: nav2_controller::SimpleProgressChecker
      required_movement_radius: 0.5
      movement_time_allowance: 10.0
    goal_checker:
      plugin: nav2_controller::SimpleGoalChecker
      xy_goal_tolerance: 0.25
      yaw_goal_tolerance: 0.25
      stateful: true
    FollowPath:
      plugin: nav2_error_compensated_pure_pursuit_controller::ErrorCompensatedPurePursuitController
      desired_linear_vel: 0.5
      lookahead_dist: 1.0
      use_velocity_scaled_lookahead_dist: false
      transform_tolerance: 0.1
      min_approach_linear_velocity: 0.05
      approach_velocity_scaling_dist: 0.6
      use_collision_detection: true
      max_allowed_time_to_collision_up_to_carrot: 1.0
      use_regulated_linear_velocity_scaling: false
      use_fixed_curvature_lookahead: false
      use_cost_regulated_linear_velocity_scaling: false
      regulated_linear_scaling_min_radius: 0.9
      regulated_linear_scaling_min_speed: 0.25
      use_rotate_to_heading: false
      allow_reversing: false
      max_robot_pose_search_dist: 10.0
      ecpp.omega_n: 1.030
      ecpp.zeta: 1.0
      ecpp.v_epsilon: 0.05
      ecpp.gate_mode: ey_only
      ecpp.gate_error_on: 0.1
      ecpp.gate_error_off: 0.5
      ecpp.gate_endpoint_value: 0.01
      ecpp.v_gain_source: commanded
