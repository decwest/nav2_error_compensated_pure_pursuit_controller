# Controller-server settings for Experiment 1. Merge into your Nav2 configuration.
# Straight path, v = 0.5 m/s, L_d = 1.0 m. Five trials per condition.
# Near path: e_y = 0.30 m, e_theta = 0 deg; PP and all six ECPP settings.
# Large error: e_y = 1.0 m, e_theta = -90 deg; PP and the three W1030 settings.
# omega_n and zeta use the precision reported in the paper.
# PP-family collision projection is disabled for the tracking comparison.

controller_server:
  ros__parameters:
    controller_frequency: 30.0
    costmap_update_timeout: 0.3
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.5
    min_theta_velocity_threshold: 0.001
    failure_tolerance: 0.3
    odom_duration: 0.3
    progress_checker_plugins:
    - progress_checker
    goal_checker_plugins:
    - goal_checker
    progress_checker:
      plugin: nav2_controller::SimpleProgressChecker
      required_movement_radius: 0.5
      movement_time_allowance: 10.0
    goal_checker:
      plugin: nav2_controller::SimpleGoalChecker
      xy_goal_tolerance: 0.1
      yaw_goal_tolerance: 0.25
      stateful: true
    controller_plugins:
    - PP_L100
    - ECPP_L100_W0707_Z0707
    - ECPP_L100_W0707_Z1000
    - ECPP_L100_W0707_Z1414
    - ECPP_L100_W1030_Z0707
    - ECPP_L100_W1030_Z1000
    - ECPP_L100_W1030_Z1414
    PP_L100:
      plugin: nav2_error_compensated_pure_pursuit_controller::ErrorCompensatedPurePursuitController
      desired_linear_vel: 0.5
      use_velocity_scaled_lookahead_dist: false
      use_fixed_curvature_lookahead: false
      allow_reversing: false
      use_regulated_linear_velocity_scaling: false
      use_cost_regulated_linear_velocity_scaling: false
      regulated_linear_scaling_min_radius: 0.9
      regulated_linear_scaling_min_speed: 0.25
      min_approach_linear_velocity: 0.05
      approach_velocity_scaling_dist: 0.6
      use_rotate_to_heading: false
      use_collision_detection: false
      max_robot_pose_search_dist: 10.0
      ecpp.omega_n: 0.707
      ecpp.zeta: 0.707
      ecpp.v_epsilon: 0.05
      ecpp.gate_mode: 'off'
      ecpp.gate_error_on: 0.1
      ecpp.gate_error_off: 0.5
      ecpp.gate_endpoint_value: 0.01
      ecpp.v_gain_source: commanded
      lookahead_dist: 1.0
    ECPP_L100_W0707_Z0707:
      plugin: nav2_error_compensated_pure_pursuit_controller::ErrorCompensatedPurePursuitController
      desired_linear_vel: 0.5
      use_velocity_scaled_lookahead_dist: false
      use_fixed_curvature_lookahead: false
      allow_reversing: false
      use_regulated_linear_velocity_scaling: false
      use_cost_regulated_linear_velocity_scaling: false
      regulated_linear_scaling_min_radius: 0.9
      regulated_linear_scaling_min_speed: 0.25
      min_approach_linear_velocity: 0.05
      approach_velocity_scaling_dist: 0.6
      use_rotate_to_heading: false
      use_collision_detection: false
      max_robot_pose_search_dist: 10.0
      ecpp.omega_n: 0.707
      ecpp.zeta: 0.707
      ecpp.v_epsilon: 0.05
      ecpp.gate_mode: ey_only
      ecpp.gate_error_on: 0.1
      ecpp.gate_error_off: 0.5
      ecpp.gate_endpoint_value: 0.01
      ecpp.v_gain_source: commanded
