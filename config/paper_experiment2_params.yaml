# Controller-server settings for Experiment 2. Merge into your Nav2 configuration.
# Indoor path; PP, RPP, ECPP, MPPI and DWB. Five trials per condition.
# PP-family lookahead is 1.0 m; MPPI and DWB use a 2.0 s prediction horizon.
# MPPI model_dt and DWB sim_period equal 1/30 s (controller frequency: 30 Hz).
# PP-family collision projection is disabled for the tracking comparison.

controller_server:
  ros__parameters:
    controller_frequency: 30.0
    costmap_update_timeout: 0.3
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.5
    min_theta_velocity_threshold: 0.001
    failure_tolerance: 0.3
    odom_duration: 0.3
    progress_checker_plugins:
    - progress_checker
    goal_checker_plugins:
    - goal_checker
    progress_checker:
      plugin: nav2_controller::SimpleProgressChecker
      required_movement_radius: 0.5
      movement_time_allowance: 20.0
    goal_checker:
      plugin: nav2_controller::SimpleGoalChecker
      xy_goal_tolerance: 0.1
      yaw_goal_tolerance: 6.28
      stateful: true
    controller_plugins:
    - PP_ARC
    - RPP_ARC
    - ECPP
    - MPPI
    - DWB
    PP_ARC:
      plugin: nav2_error_compensated_pure_pursuit_controller::ErrorCompensatedPurePursuitController
      desired_linear_vel: 0.5
      lookahead_dist: 1.0
      use_velocity_scaled_lookahead_dist: false
      use_fixed_curvature_lookahead: false
      allow_reversing: false
      use_regulated_linear_velocity_scaling: false
      use_cost_regulated_linear_velocity_scaling: false
      regulated_linear_scaling_min_radius: 0.9
      regulated_linear_scaling_min_speed: 0.25
      min_approach_linear_velocity: 0.05
      approach_velocity_scaling_dist: 0.6
      use_rotate_to_heading: false
      use_collision_detection: false
      max_allowed_time_to_collision_up_to_carrot: 1.0
      max_robot_pose_search_dist: 10.0
      max_angular_accel: 5.5
      ecpp.omega_n: 1.030
      ecpp.zeta: 1.0
      ecpp.v_epsilon: 0.05
      ecpp.gate_mode: 'off'
      ecpp.gate_error_on: 0.1
      ecpp.gate_error_off: 0.5
      ecpp.gate_endpoint_value: 0.01
      ecpp.v_gain_source: commanded
    RPP_ARC:
      plugin: nav2_error_compensated_pure_pursuit_controller::ErrorCompensatedPurePursuitController
      desired_linear_vel: 0.5
      lookahead_dist: 1.0
      use_velocity_scaled_lookahead_dist: false
      use_fixed_curvature_lookahead: false
      allow_reversing: false
      use_regulated_linear_velocity_scaling: true
      use_cost_regulated_linear_velocity_scaling: false
      regulated_linear_scaling_min_radius: 1.5
      regulated_linear_scaling_min_speed: 0.1
      min_approach_linear_velocity: 0.05
      approach_velocity_scaling_dist: 0.6
      use_rotate_to_heading: false
      use_collision_detection: false
      max_allowed_time_to_collision_up_to_carrot: 1.0
      max_robot_pose_search_dist: 10.0
      max_angular_accel: 5.5
      ecpp.omega_n: 1.030
      ecpp.zeta: 1.0
      ecpp.v_epsilon: 0.05
      ecpp.gate_mode: 'off'
      ecpp.gate_error_on: 0.1
      ecpp.gate_error_off: 0.5
      ecpp.gate_endpoint_value: 0.01
      ecpp.v_gain_source: commanded
    ECPP:
      plugin: nav2_error_compensated_pure_pursuit_controller::ErrorCompensatedPurePursuitController
      desired_linear_vel: 0.5
      lookahead_dist: 1.0
      use_velocity_scaled_lookahead_dist: false
      use_fixed_curvature_lookahead: false
      allow_reversing: false
      use_regulated_linear_velocity_scaling: false
      use_cost_regulated_linear_velocity_scaling: false
      regulated_linear_scaling_min_radius: 0.9
      regulated_linear_scaling_min_speed: 0.25
      min_approach_linear_velocity: 0.05
      approach_velocity_scaling_dist: 0.6
      use_rotate_to_heading: false
      use_collision_detection: false
      max_allowed_time_to_collision_up_to_carrot: 1.0
      max_robot_pose_search_dist: 10.0
      max_angular_accel: 5.5
      ecpp.omega_n: 1.030
      ecpp.zeta: 1.0
      ecpp.v_epsilon: 0.05
      ecpp.gate_mode: ey_only
      ecpp.gate_error_on: 0.1
      ecpp.gate_error_off: 0.5
      ecpp.gate_endpoint_value: 0.01
      ecpp.v_gain_source: commanded
    MPPI:
      plugin: nav2_mppi_controller::MPPIController
      time_steps: 60
      model_dt: 0.03333333333333333
      batch_size: 2000
      ax_max: 1.7
      ax_min: -1.7
      ay_max: 0.0
      ay_min: -0.0
      az_max: 5.5
      vx_std: 0.2
      vy_std: 0.0
      wz_std: 0.4
      vx_max: 0.5
      vx_min: 0.0
      vy_max: 0.0
      wz_max: 1.5
      iteration_count: 1
      prune_distance: 1.7
      transform_tolerance: 0.1
      temperature: 0.2
      gamma: 0.015
      motion_model: DiffDrive
      visualize: false
      regenerate_noises: false
      TrajectoryVisualizer:
        trajectory_step: 5
        time_step: 3
      critics:
      - ConstraintCritic
      - CostCritic
      - GoalCritic
      - GoalAngleCritic
      - PathAlignCritic
      - PathFollowCritic
      - PathAngleCritic
      - PreferForwardCritic
      ConstraintCritic:
        enabled: true
        cost_power: 1
        cost_weight: 4.0
      GoalCritic:
        enabled: true
        cost_power: 1
        cost_weight: 5.0
        threshold_to_consider: 1.0
      GoalAngleCritic:
        enabled: true
        cost_power: 1
        cost_weight: 3.0
        threshold_to_consider: 0.5
      PreferForwardCritic:
        enabled: true
        cost_power: 1
        cost_weight: 5.0
        threshold_to_consider: 0.5
      CostCritic:
        enabled: true
        cost_power: 1
        cost_weight: 3.81
        near_collision_cost: 253
        critical_cost: 300.0
        consider_footprint: true
        collision_cost: 1000000.0
        near_goal_distance: 1.0
        trajectory_point_step: 2
      PathAlignCritic:
        enabled: true
        cost_power: 1
        cost_weight: 30.0
        max_path_occupancy_ratio: 0.05
        trajectory_point_step: 4
        threshold_to_consider: 0.5
        offset_from_furthest: 13
        use_path_orientations: false
      PathFollowCritic:
        enabled: true
        cost_power: 1
        cost_weight: 10.0
        offset_from_furthest: 13
        threshold_to_consider: 1.0
      PathAngleCritic:
        enabled: true
        cost_power: 1
        cost_weight: 6.0
        offset_from_furthest: 4
        threshold_to_consider: 0.5
        max_angle_to_furthest: 1.0
        mode: 0
    DWB:
      plugin: dwb_core::DWBLocalPlanner
      debug_trajectory_details: false
      min_vel_x: 0.0
      min_vel_y: 0.0
      max_vel_x: 0.5
      max_vel_y: 0.0
      max_vel_theta: 1.5
      min_speed_xy: 0.0
      max_speed_xy: 0.5
      min_speed_theta: 0.0
      acc_lim_x: 1.7
      acc_lim_y: 0.0
      acc_lim_theta: 5.5
      decel_lim_x: -1.7
      decel_lim_y: 0.0
      decel_lim_theta: -5.5
      vx_samples: 20
      vy_samples: 1
      vtheta_samples: 20
      sim_time: 2.0
      linear_granularity: 0.05
      angular_granularity: 0.025
      transform_tolerance: 0.2
      xy_goal_tolerance: 0.1
      trans_stopped_velocity: 0.25
      short_circuit_trajectory_evaluation: true
      stateful: true
      critics:
      - RotateToGoal
      - Oscillation
      - BaseObstacle
      - GoalAlign
      - PathAlign
      - PathDist
      - GoalDist
      BaseObstacle.scale: 0.02
      PathAlign.scale: 32.0
      PathAlign.forward_point_distance: 0.1
      GoalAlign.scale: 24.0
      GoalAlign.forward_point_distance: 0.1
      PathDist.scale: 32.0
      GoalDist.scale: 24.0
      RotateToGoal.scale: 32.0
      RotateToGoal.slowing_factor: 5.0
      RotateToGoal.lookahead_time: -1.0
      trajectory_generator_name: dwb_plugins::LimitedAccelGenerator
      sim_period: 0.03333333333333333

